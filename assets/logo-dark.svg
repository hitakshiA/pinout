<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-label="Pinout">
  <defs>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a98bff"/><stop offset="1" stop-color="#5b34c9"/>
    </linearGradient>
  </defs>
  <!-- the mark: a socket with four pins entering it. a pinout is the map of
       which line lands on which pin, so the mark is that, not an app icon -->
  <g transform="translate(150,48)">
    <g stroke="#8259ef" stroke-width="9" stroke-linecap="round">
      <path d="M42 -18 v18"/><path d="M42 102 v-18"/>
      <path d="M-18 42 h18"/><path d="M102 42 h-18"/>
    </g>
    <rect y="0" width="84" height="84" rx="24" fill="url(#m)"/>
    <rect x="30" y="30" width="24" height="24" rx="7" fill="#06040d"/>
  </g>
  <text x="272" y="116" font-family="Inter, SF Pro Display, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="78" font-weight="700" letter-spacing="-2.8" fill="#ffffff">Pinout</text>
</svg>
