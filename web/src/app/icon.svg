      <path d="M50 -14 v14"/><path d="M50 114 v-14"/>
      <path d="M-14 50 h14"/><path d="M114 50 h-14"/>
    </g>
    <rect width="100" height="100" rx="28" fill="url(#m)"/>
    <rect x="36" y="36" width="28" height="28" rx="8" fill="#06040d"/>
  </g>
</svg>
