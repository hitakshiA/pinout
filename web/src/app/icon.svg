<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 144 144" role="img" aria-label="Pinout">
  <defs>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a98bff"/><stop offset="1" stop-color="#5b34c9"/>
    </linearGradient>
  </defs>
  <!-- the socket-and-pins mark from the wordmark, cropped to just the glyph so
       it still reads at 16px, where the "Pinout" text never would -->
